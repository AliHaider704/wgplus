plugins {
    id 'com.android.application'
}

android {
    namespace 'org.telegram.wgplus.module'
    compileSdk 35
    buildToolsVersion "36.0.0"

    def emulatorTestBuild = (project.findProperty('emulatorTestBuild') ?: 'false').toString().toBoolean()

    defaultConfig {
        applicationId "org.telegram.wgplus.module"
        minSdk 21
        targetSdk 34
        versionCode 25
        versionName "2.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable !emulatorTestBuild
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    // Signing secrets live in keystore.properties (git-ignored). Without it the
    // build falls back to the Android debug key, so a fresh clone still builds.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'org/bouncycastle/pqc/**',
                'org/bouncycastle/x509/CertPathReviewerMessages*.properties',
                'kotlin/**',
                'META-INF/*.kotlin_module',
                'META-INF/androidx/**',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/DEPENDENCIES',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
            ]
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation files('libs/wgbridge.aar')
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def distDir = new File(rootProject.projectDir, 'dist')
            distDir.mkdirs()
            def ver = android.defaultConfig.versionName
            def relDir = file("${buildDir}/outputs/apk/release")
            def mapping = [
                [src: "app-arm64-v8a-release.apk",   abi: "arm64-v8a",   dst: "WireGuardPlus-${ver}-arm64-v8a.apk"],
                [src: "app-armeabi-v7a-release.apk", abi: "armeabi-v7a", dst: "WireGuardPlus-${ver}-armeabi-v7a.apk"],
                [src: "app-universal-release.apk",   abi: "universal",   dst: "WireGuardPlus-${ver}.apk"]
            ]
            def artifactsMeta = []
            mapping.each { entry ->
                def srcFile = new File(relDir, entry.src)
                if (srcFile.exists()) {
                    def dstFile = new File(distDir, entry.dst)
                    copy {
                        from srcFile
                        into distDir
                        rename { entry.dst }
                    }
                    def digest = java.security.MessageDigest.getInstance('SHA-256')
                    dstFile.withInputStream { is ->
                        byte[] buf = new byte[8192]
                        int read
                        while ((read = is.read(buf)) > 0) {
                            digest.update(buf, 0, read)
                        }
                    }
                    def shaHex = digest.digest().collect { String.format('%02x', it) }.join('')
                    artifactsMeta << [
                        file: entry.dst,
                        abi: entry.abi,
                        sizeBytes: dstFile.length(),
                        sha256: shaHex
                    ]
                }
            }
            def meta = [
                versionName: ver,
                versionCode: android.defaultConfig.versionCode,
                packageName: android.defaultConfig.applicationId,
                supportedTargetPackages: [
                    'org.telegram.plus',
                    'org.telegram.messenger',
                    'org.telegram.messenger.web',
                    'org.telegram.messenger.beta',
                    'org.telegram.gold',
                    'ir.ilmili.telegraph',
                    'ir.p2021.telegraph',
                    'com.radolyn.ayugram',
                    'org.thunderdog.challegram'
                ],
                artifacts: artifactsMeta
            ]
            new File(distDir, 'android-build-meta.json').setText(
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta)) + '\n',
                'UTF-8'
            )
        }
    }
}
