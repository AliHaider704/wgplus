plugins {
    id 'com.android.application'
}

android {
    namespace 'org.telegram.wgplus.module'
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "org.telegram.wgplus.module"
        minSdk 21
        targetSdk 34
        versionCode 9
        versionName "1.4.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Signing secrets live in keystore.properties (git-ignored). Without it the
    // build falls back to the Android debug key, so a fresh clone still builds.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    implementation files('libs/wgbridge.aar')
    implementation 'com.google.zxing:core:3.5.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def builtApk = file("${buildDir}/outputs/apk/release/app-release.apk")
            if (builtApk.exists()) {
                copy {
                    from builtApk
                    into new File(rootProject.projectDir, 'dist')
                    rename { "WireGuardPlus-${android.defaultConfig.versionName}.apk" }
                }
            }
        }
    }
}
