name: Firebase Test Lab (Real OEM Devices)

on:
  workflow_dispatch:
    inputs:
      device_matrix:
        description: "Device quota mode: standard (3 physical OEMs) or virtual-only"
        required: false
        default: "standard"
        type: string
      extra_host_apk_url:
        description: "Optional direct HTTP(S) URL of an LSPatch-patched Telegram APK to robo-smoke-test"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "qa/**"
    tags:
      - "v*"

jobs:
  firebase-test-lab:
    name: Firebase Test Lab Real-Device Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase Test Lab credentials
        id: check_auth
        env:
          FTL_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FTL_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -z "$FTL_SA_JSON" ] || [ -z "$FTL_PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Firebase Test Lab skipped (credentials not configured)"
              echo "Add \`FIREBASE_SERVICE_ACCOUNT_JSON\` and \`GCP_PROJECT_ID\` to repository secrets to enable free Spark-tier physical device runs (see \`docs/QA_PIPELINE.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: wgbridge-go/go.mod
          cache-dependency-path: wgbridge-go/go.sum

      - name: Setup Java 21
        if: steps.check_auth.outputs.configured == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK & NDK
        if: steps.check_auth.outputs.configured == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          CMDLINE_BIN="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -n 1)"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$CMDLINE_BIN:$SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Build real-device wgbridge.aar (arm64-v8a + armeabi-v7a)
        if: steps.check_auth.outputs.configured == 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x gradlew scripts/build-wgbridge-ci-x86_64.sh
          bash scripts/build-wgbridge-ci-x86_64.sh android/arm64,android/arm

      - name: Build universal debug APK & instrumentation APK
        if: steps.check_auth.outputs.configured == 'true'
        run: ./gradlew assembleDebug assembleDebugAndroidTest -PemulatorTestBuild=true --no-daemon

      - name: Authenticate to Google Cloud
        if: steps.check_auth.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud CLI
        if: steps.check_auth.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Select active Firebase Test Lab devices within free Spark tier
        if: steps.check_auth.outputs.configured == 'true'
        id: select_devices
        env:
          MATRIX_MODE: ${{ inputs.device_matrix || 'standard' }}
        run: |
          FORM_FILTER="PHYSICAL"
          if [ "$MATRIX_MODE" = "virtual-only" ]; then
            FORM_FILTER="VIRTUAL"
          fi
          gcloud firebase test android models list --format=json > /tmp/ftl_models.json
          DEVICE_FLAGS=$(python3 - /tmp/ftl_models.json "$FORM_FILTER" <<'PYEOF'
          import json, sys

          models = json.load(open(sys.argv[1], encoding="utf-8"))
          form = sys.argv[2]

          def pick(brand_prefs, min_api=28, max_count=3):
              chosen = []
              seen_brands = set()
              candidates = []
              for m in models:
                  if m.get("form") != form:
                      continue
                  tags = m.get("tags") or []
                  if "deprecated" in tags or "directAccessOnly" in tags:
                      continue
                  per_ver = m.get("perAndroidVersionInfo") or []
                  high_cap = [
                      int(v["versionId"])
                      for v in per_ver
                      if str(v.get("versionId", "")).isdigit()
                      and "HIGH" in str(v.get("deviceCapacity", "")).upper()
                      and min_api <= int(v["versionId"]) <= 35
                  ]
                  if high_cap:
                      best_api = max(high_cap)
                  else:
                      vers = [int(v) for v in (m.get("supportedVersionIds") or []) if str(v).isdigit() and int(v) >= min_api]
                      if not vers:
                          continue
                      stable = [v for v in vers if v <= 35]
                      best_api = max(stable) if stable else max(vers)
                  candidates.append((m.get("brand", ""), m.get("id", ""), best_api))

              # Pick highest supported API for preferred OEM diversity first
              candidates.sort(key=lambda x: (-x[2], x[1]))
              for pref in brand_prefs:
                  for brand, mid, api in candidates:
                      if brand.lower() == pref.lower() and brand.lower() not in seen_brands:
                          chosen.append((mid, api))
                          seen_brands.add(brand.lower())
                          break
                  if len(chosen) >= max_count:
                      break
              if len(chosen) < max_count:
                  used_ids = {mid for mid, _ in chosen}
                  for brand, mid, api in candidates:
                      if mid not in used_ids:
                          chosen.append((mid, api))
                          used_ids.add(mid)
                          if len(chosen) >= max_count:
                              break
              return chosen

          picked = pick(["Xiaomi", "Samsung", "Google", "Motorola"], min_api=28, max_count=2)
          if not picked:
              raise SystemExit(f"No matching FTL devices found for form={form}")
          print(" ".join(f"--device model={mid},version={api},locale=en,orientation=portrait" for mid, api in picked))
          PYEOF
          )
          echo "flags=$DEVICE_FLAGS" >> "$GITHUB_OUTPUT"
          echo "Selected FTL devices: $DEVICE_FLAGS"

      - name: Run instrumentation smoke suite on Firebase Test Lab
        if: steps.check_auth.outputs.configured == 'true'
        run: |
          # shellcheck disable=SC2086
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            ${{ steps.select_devices.outputs.flags }} \
            --timeout 5m \
            --no-auto-google-login

      - name: Optional Robo smoke check on LSPatch-embedded host APK
        if: steps.check_auth.outputs.configured == 'true' && inputs.extra_host_apk_url != ''
        env:
          EXTRA_APK_URL: ${{ inputs.extra_host_apk_url }}
        run: |
          curl -fL --retry 3 -o /tmp/patched-host.apk "$EXTRA_APK_URL"
          FIRST_DEV=$(echo "${{ steps.select_devices.outputs.flags }}" | awk '{print $2}')
          gcloud firebase test android run \
            --type robo \
            --app /tmp/patched-host.apk \
            --device "$FIRST_DEV" \
            --timeout 2m \
            --no-auto-google-login
