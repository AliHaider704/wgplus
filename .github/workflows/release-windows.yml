name: Release Windows Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional existing or new release tag (e.g. v1.6.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build & Attest Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: desktop-win/go.mod

      - name: Install Wails v2 CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin

      - name: Test, Build & Self-Check Windows Artifacts
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-windows.ps1

      - name: Generate Windows SHA-256 Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(
            "dist\WireGuardPlus-Windows-x64.exe",
            "dist\WireGuardPlus-Windows-x64-Portable.zip"
          )
          $lines = foreach ($f in $files) {
            $item = Get-Item $f
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "{0}  {1}" -f $hash, $item.Name
          }
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path "dist").Path "SHA256SUMS-windows.txt"),
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )
          if (-not [string]::IsNullOrWhiteSpace($env:WGPLUS_UPDATER_ED25519_PRIV_HEX)) {
            go run scripts/sign-windows-sums.go -sign -in "dist\SHA256SUMS-windows.txt" -out "dist\SHA256SUMS-windows.txt.sig"
            if ($LASTEXITCODE -ne 0) { throw "Ed25519 signing failed" }
          } else {
            Write-Host "Offline Ed25519 signing policy active: upload local dist/WireGuardPlus-Windows-x64.exe, SHA256SUMS-windows.txt, and SHA256SUMS-windows.txt.sig signed via .offline_keys/."
          }
          Get-Content "dist\SHA256SUMS-windows.txt"
        env:
          WGPLUS_UPDATER_ED25519_PRIV_HEX: ${{ secrets.WGPLUS_UPDATER_ED25519_PRIV_HEX }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/WireGuardPlus-Windows-x64.exe
            dist/WireGuardPlus-Windows-x64-Portable.zip

      - name: Upload Windows Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-plus-windows-x64
          path: |
            dist/WireGuardPlus-Windows-x64.exe
            dist/WireGuardPlus-Windows-x64-Portable.zip
            dist/SHA256SUMS-windows.txt
            dist/SHA256SUMS-windows.txt.sig
          if-no-files-found: ignore

      - name: Upload Windows Assets to GitHub Release (if tagged or dispatched)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = ""
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } elseif (-not [string]::IsNullOrWhiteSpace("${{ inputs.tag }}")) {
            $tag = "${{ inputs.tag }}".Trim()
          }

          if ([string]::IsNullOrWhiteSpace($tag)) {
            Write-Host "No release tag specified; skipping GitHub Release upload."
            exit 0
          }

          $prevPref = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $releaseJson = & gh release view $tag --json assets 2>$null
          $viewExit = $LASTEXITCODE
          $ErrorActionPreference = $prevPref

          if ($viewExit -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) {
            Write-Host "Creating GitHub release $tag with Windows assets..."
            $assets = @("dist\WireGuardPlus-Windows-x64.exe", "dist\WireGuardPlus-Windows-x64-Portable.zip", "dist\SHA256SUMS-windows.txt")
            if (Test-Path "dist\SHA256SUMS-windows.txt.sig") { $assets += "dist\SHA256SUMS-windows.txt.sig" }
            & gh release create $tag @assets --notes-file "docs\release-notes\$tag.md"
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
            exit 0
          }

          $parsed = $releaseJson | ConvertFrom-Json
          $hasExe = @($parsed.assets | Where-Object { $_.name -eq "WireGuardPlus-Windows-x64.exe" }).Count -gt 0
          $hasSig = @($parsed.assets | Where-Object { $_.name -eq "SHA256SUMS-windows.txt.sig" }).Count -gt 0
          if (Test-Path "docs\release-notes\$tag.md") { & gh release edit $tag --notes-file "docs\release-notes\$tag.md" }
          if ($hasExe -or $hasSig) {
            Write-Host "Release $tag already contains offline-signed Windows assets; skipping asset overwrite to preserve SHA256SUMS-windows.txt and its offline Ed25519 signature."
            exit 0
          }

          Write-Host "Uploading Windows assets to existing release $tag..."
          $assets = @("dist\WireGuardPlus-Windows-x64.exe", "dist\WireGuardPlus-Windows-x64-Portable.zip", "dist\SHA256SUMS-windows.txt")
          if (Test-Path "dist\SHA256SUMS-windows.txt.sig") { $assets += "dist\SHA256SUMS-windows.txt.sig" }
          & gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
